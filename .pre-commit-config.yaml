# Install once with:  pip install pre-commit && pre-commit install
# Run against everything: pre-commit run --all-files
repos:
  # ---------------------------------------------------------------------
  # Secret scanning — the most important hook in this repository.
  # ---------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------
  # General hygiene
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key      # second line of defence for *.pem
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: '\.md$'

  # ---------------------------------------------------------------------
  # Shell scripts
  # ---------------------------------------------------------------------
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
